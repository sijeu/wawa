<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="card">

    <h1>Dashboard</h1>

    <p id="welcome">Loading...</p>

    <div class="image-container">

    <div class="image-box">
        <img src="462752d4-5e5b-4752-8660-2df24066969d-removebg-preview.png" alt="Image 1">
    </div>

    <div class="image-box">
        <img src="download.jpg" alt="Image 2">
    </div>

    <div class="image-box">
        <img src="download (1).jpg" alt="Image 3">
    </div>

    <div class="image-box">
        <img src="531f5be0-67ce-42e6-bd6c-63e06c748147-removebg-preview.png" alt="Image 4">
    </div>

</div>

    <button id="logout">Logout</button>
    

  </main>

  <script>

    const API_URL = "https://login-system-97ea.onrender.com";

    const token = localStorage.getItem("token");

    if (!token) {
      window.location.href = "index.html";
    }

    fetch(`${API_URL}/api/profile`, {
      headers: {
        Authorization: `Bearer ${token}`
      }
    })

    .then(response => {

      if (!response.ok) {
        throw new Error();
      }

      return response.json();

    })

    .then(data => {

      document.getElementById("welcome").textContent =
        `Welcome, ${data.user.name} (${data.user.email})`;

    })

    .catch(() => {

      localStorage.removeItem("token");

      window.location.href = "index.html";

    });

    document.getElementById("logout").addEventListener("click", () => {

      localStorage.removeItem("token");

      window.location.href = "index.html";

    });

  </script>

</body>

</html>
